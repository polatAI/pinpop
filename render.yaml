# Render blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: pinpop
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pinpop-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: PUBLIC_URL
        sync: false
      - key: AI_PROVIDER
        sync: false
      - key: AI_API_KEY
        sync: false
    disk:
      name: pinpop-data
      mountPath: /data
      sizeGB: 1

databases:
  - name: pinpop-db
    plan: basic-256mb
    databaseName: pinpop
    user: pinpop
