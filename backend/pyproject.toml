[project]
name = "pinpop"
version = "0.1.0"
description = "Open-source, self-hostable live quiz platform with AI question generation and MCP support."
authors = [
    { name = "polatAI", email = "1seyfullahpolat@gmail.com" }
]
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
keywords = ["quiz", "education", "classroom", "live-quiz", "mcp", "ai", "self-hosted"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "mcp>=2.3.0",
    "openai>=3.59.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "python-socketio>=5.18.1",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pinpop = "pinpop.__main__:main"
pinpop-mcp = "pinpop.mcp.cli:main"

[project.urls]
Homepage = "https://github.com/polatAI/pinpop"
Issues = "https://github.com/polatAI/pinpop/issues"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "asgi-lifespan>=2.1.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "N803", "N815",  # camelCase names mirror the JSON wire format
    "S101",          # asserts are fine in tests
    "S104",          # binding to 0.0.0.0 is intended for containers
    "E501",          # long strings and docstrings; the formatter handles code
    "RUF001", "RUF002", "RUF003",  # emoji and typographic characters are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "ASYNC109", "ASYNC110"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
